extends: existence
message: "'%s' pins a claim to a date. Say what is true now. Move a current rule's history to an ADR the doc links, and a temporary note to the tracker. In an ADR, write the date on its own."
link: https://github.com/betsalel-williamson/mdcp/blob/main/docs/features/design-constraints/enforceable-rules.md
level: error
ignorecase: true
nonword: true
tokens:
  - '\b(?:as\s+of|until)\s+\d{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12]\d|3[01])(?:T|\b)'
