extends: existence
message: "Bare heading mention '%s' should be a GFM markdown link, e.g. See [Section 2](./other.md#section-2) for details."
link: https://github.com/Merlon-Docs/merlon/blob/main/docs/features/design-constraints/locale-and-language.md
level: error
scope: ~heading
nonword: true
tokens:
  - '\bSec\.?\s*\d+(?:\s*[–—-]\s*[^\s|.\n]+)?'
  - '\bSection\s+\d+(?:\s*[–—-]\s*[^\s|.\n]+)?'
  - '\b(?:Secs\.|Sections)\s+\d+(?:\s*(?:,|and|&|/|-|to)\s*\d+)+\b'
