extends: existence
message: "Unlinked '%s' should be a GFM markdown link, e.g. See [Chapter 2](./other.md#chapter-2) for details."
link: https://github.com/Merlon-Docs/merlon/blob/main/docs/features/design-constraints/locale-and-language.md
level: error
scope: ~heading
nonword: true
tokens:
  - '\bSee\s+Chapter\s+\d+\b'
  - '\bSee\s+(?:Chs\.|Chapters)\s+\d+(?:\s*(?:,|and|&|/|-|to)\s*\d+)+\b'
