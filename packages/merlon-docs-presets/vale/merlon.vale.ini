# Sample Vale config for Merlon Docs consumers.
#
# Preferred package install for release zips:
#   Packages = https://github.com/Merlon-Docs/merlon/releases/download/<tag>/merlon-docs-presets-vale.zip
#   vale sync
#
# Vale 3.15.1 syncs local directory packages from node_modules as style files
# but moves the package .vale.ini, so npm-directory installs should copy or
# symlink node_modules/@merlon-docs/merlon-docs-presets/vale/MerlonDocs into StylesPath.
#
# Merge with other packages by listing each one and combining styles:
#   Packages = Microsoft, https://github.com/Merlon-Docs/merlon/releases/download/<tag>/merlon-docs-presets-vale.zip
#   BasedOnStyles = Microsoft, MerlonDocs
#
# The MerlonDocs package config enables the MerlonDocs style and ignores already-linked GFM
# markdown tokens. Keep TokenIgnores locally for npm-directory fallback installs.
# The heading-mention rules use scope: ~heading (body prose). MerlonDocs.DatedClaim
# keeps the default scope, so it also checks headings. Set
# MerlonDocs.DatedClaim = warning to report dated claims without failing merlon check.
# Pair with a heading-scoped local style if you also want to warn on Pandoc
# IDs ({#…}).

StylesPath = styles
MinAlertLevel = suggestion

[*.{md,mdx}]
BasedOnStyles = MerlonDocs
TokenIgnores = \[(?:\\.|[^\[\]\\]|\[(?:\\.|[^\[\]\\])*\])*\]\([^)]*\)
