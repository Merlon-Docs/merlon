name: Land on develop

# Trunk-based landing: a push to a claude/** or land/** branch is merged with
# the current develop, run through the gate below (CI's Check and Changeset
# jobs, plus the Formal models job when formal/ changed), and pushed to develop
# when it passes. No pull request is needed for develop; review and approval
# happen once, on the release PR from develop to main.
#
# sync-develop.yml dispatches this workflow on land/sync-main, because its push
# is made with GITHUB_TOKEN and starts no workflow. A dispatch on any branch
# outside claude/** and land/** fails in the gate.

on:
  push:
    branches:
      - 'claude/**'
      - 'land/**'
  workflow_dispatch:

concurrency:
  # One landing at a time, so develop only moves under a tested tree.
  group: land-develop
  cancel-in-progress: false

# Force JS actions onto Node 24 (Node 20 deprecated on runners).
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.merge.outputs.skip }}
      develop_sha: ${{ steps.merge.outputs.develop_sha }}
      tree: ${{ steps.merge.outputs.tree }}
    steps:
      # Harden-Runner: audit mode only — logs egress; block mode is follow-up (#179).
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge develop into the pushed commit
        id: merge
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A dispatch can name any ref; only the branches a push lands may land.
          case "$GITHUB_REF" in
            refs/heads/claude/* | refs/heads/land/*) ;;
            *)
              echo "::error::Only claude/** and land/** branches land on develop, not ${GITHUB_REF}."
              exit 1
              ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          develop_sha="$(git rev-parse origin/develop)"
          echo "develop_sha=${develop_sha}" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor HEAD origin/develop; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "develop already contains ${BRANCH} at $(git rev-parse --short HEAD). Nothing to land." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge --no-edit origin/develop -m "chore: merge develop into ${BRANCH}"; then
            git merge --abort || true
            echo "::error::${BRANCH} conflicts with develop. Merge develop into the branch, resolve, and push again."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - if: steps.merge.outputs.skip == 'false'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - if: steps.merge.outputs.skip == 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - if: steps.merge.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile

      - name: Install Vale
        if: steps.merge.outputs.skip == 'false'
        run: |
          VALE_VERSION=3.15.1
          curl -fsSL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar xz -C /usr/local/bin vale

      - name: Gate (mirrors CI Check and Changeset, plus Formal models when they change)
        if: steps.merge.outputs.skip == 'false'
        env:
          CHANGESET_SINCE: ${{ steps.merge.outputs.develop_sha }}
        run: |
          set -euo pipefail
          pnpm run verify:peers
          pnpm audit --audit-level=high
          pnpm run typecheck
          pnpm run lint
          pnpm run format:check
          pnpm run build
          pnpm run test
          pnpm run skill:validate
          pnpm run prepare:docs
          pnpm run docs:check
          pnpm run docs:compile
          git diff --exit-code
          # The models' results depend only on these files, and the run takes minutes.
          if ! git diff --quiet "$CHANGESET_SINCE" HEAD -- formal scripts/formal-check.mjs scripts/lib/alloy-receipt.mjs; then
            pnpm formal:check
          fi
          pnpm changeset:reject-major
          pnpm changeset:status

  land:
    name: Land
    needs: gate
    if: needs.gate.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the tested merge to develop
      actions: write # Dispatch the Pages deploy for the new develop
    steps:
      # Harden-Runner: audit mode only — logs egress; block mode is follow-up (#179).
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Fresh checkout: no code from the pushed branch has run in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rebuild the tested merge and push it to develop
        env:
          BRANCH: ${{ github.ref_name }}
          DEVELOP_SHA: ${{ needs.gate.outputs.develop_sha }}
          TESTED_TREE: ${{ needs.gate.outputs.tree }}
          # GITHUB_TOKEN, so no maintainer PAT is exposed to branch pushes. Its
          # push does not start CI on develop; the gate above already ran it.
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          if [ "$(git rev-parse origin/develop)" != "${DEVELOP_SHA}" ]; then
            echo "::error::develop moved while ${BRANCH} was being tested. Re-run all jobs of this workflow, or push a new commit to the branch, to test it against the new develop. Re-running only the failed job reuses the old develop and fails again."
            exit 1
          fi
          git merge --no-edit "${DEVELOP_SHA}" -m "chore: merge develop into ${BRANCH}" >/dev/null || {
            echo "::error::Rebuilding the merge failed."
            exit 1
          }
          if [ "$(git rev-parse 'HEAD^{tree}')" != "${TESTED_TREE}" ]; then
            echo "::error::The rebuilt tree differs from the tested tree. Not landing."
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/develop"
          {
            echo "## Landed ${BRANCH} on develop"
            echo ""
            echo "develop: \`${DEVELOP_SHA:0:7}\` → \`$(git rev-parse --short HEAD)\`"
            echo ""
            echo "Commits landed:"
            echo ""
            git log --format='- `%h` %s' "${DEVELOP_SHA}..HEAD" --no-merges
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Deploy the docs site from develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git cat-file -e HEAD:.github/workflows/pages.yml 2>/dev/null; then
            gh workflow run pages.yml --ref develop --repo "${GITHUB_REPOSITORY}"
            echo "Dispatched the Pages deploy for develop." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
