name: betterleaks

on:
  push:
    branches:
      - 'claude/**'
      - 'land/**'
  pull_request:
    # Drafts are skipped, and marking a PR ready runs this once.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Force JS actions onto Node 24 (Node 20 deprecated on runners).
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      actions: read
      contents: read
    steps:
      # Harden-Runner: audit mode only — logs egress; block mode is follow-up (#179).
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # A landing's commit reaches a pull request (the release PR) with the SHA
      # its claude/** or land/** push already scanned. When that push scan
      # passed, the PR's scan would repeat it, so this run passes without
      # scanning. A failed, missing or still-running push scan means a full scan.
      - id: scanned
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          last=$(gh api "repos/$REPO/actions/workflows/betterleaks.yml/runs?head_sha=$HEAD_SHA&event=push&per_page=20" \
            --jq '.workflow_runs | sort_by(.created_at) | last | "\(.status)/\(.conclusion)"') || last=""
          if [ "$last" = completed/success ]; then
            echo "The push scan of $HEAD_SHA passed, so this run doesn't scan again."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.scanned.outputs.skip != 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      # Betterleaks needs no license or secret, so Dependabot's pull requests,
      # which get no repository secrets, scan like any other.
      - name: Install Betterleaks
        if: steps.scanned.outputs.skip != 'true'
        env:
          BETTERLEAKS_VERSION: 1.10.0
          BETTERLEAKS_SHA256: 9d9ad503cd5d80d18a939352266c3fcca52f10da9b83cd5cfe646989b13940fe
        run: |
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/$archive"
          echo "$BETTERLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/betterleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/betterleaks" betterleaks
          echo "$RUNNER_TEMP/betterleaks" >> "$GITHUB_PATH"

      # Scans the whole history, which takes seconds on this repository.
      - name: Scan
        if: steps.scanned.outputs.skip != 'true'
        run: betterleaks git . --config .betterleaks.toml --redact --no-banner --verbose
