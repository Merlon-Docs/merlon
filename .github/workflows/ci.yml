name: CI

on:
  push:
    # PR updates cover develop, including the release PR from develop to main.
    # Keeping develop out avoids running CI twice for each release-PR push.
    # A push to main that a squashed PR made holds the tree that PR's CI already
    # tested, so the Already tested job skips the rest. The release commit has
    # no PR, so CI tests it.
    branches: [main]
  pull_request:
    # Any target branch (stacked feature PRs, not only main).
    # Changeset checks use github.event.pull_request.base.sha — never a hardcoded branch name.
    # PRs open as drafts, and every job skips a draft. GitHub won't merge
    # a draft, so the skipped run it records, which counts as passing for a
    # required check, can't let one merge. `ready_for_review` runs CI once
    # when the PR is marked ready, and later pushes run it again.
    # `edited` fires when a PR's base changes, so a PR moved to another base is
    # tested against that base before it can merge. It also fires on title and
    # body edits. A skipped run counts as passing for a required check, so an
    # edit that leaves the base alone skips the jobs only when the PR's latest
    # finished CI run on that head passed (the Already tested job). After a
    # failed or cancelled run, an edit runs everything again, so a skip never
    # replaces a failure. The concurrency group below cancels the run an edit
    # makes stale.
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Force JS actions onto Node 24 (Node 20 deprecated on runners).
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  tested:
    name: Already tested
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.match.outputs.skip }}
    steps:
      # Harden-Runner: audit mode only — logs egress; block mode is follow-up (#179).
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # skip=true only when the newest other CI run on the tested head finished
      # and passed: the squashed PR's head for a push to main, or this PR's head
      # for an edit that leaves the base alone. A newer run that is still going,
      # was cancelled or failed (say, after a base change) means a full run, and
      # so does any API failure.
      - id: match
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_CHANGED: ${{ github.event.changes.base && 'true' || 'false' }}
        run: |
          tested=""
          if [ "$EVENT" = push ]; then
            head=$(gh api "repos/$REPO/commits/$SHA/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].head.sha // ""') || head=""
            if [ -n "$head" ]; then
              tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha) || tree=""
              head_tree=$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha) || head_tree=""
              if [ -n "$tree" ] && [ "$tree" = "$head_tree" ]; then tested=$head; fi
            fi
          elif [ "$ACTION" = edited ] && [ "$BASE_CHANGED" != true ]; then
            tested=$HEAD_SHA
          fi
          last=""
          if [ -n "$tested" ]; then
            last=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$tested&event=pull_request&per_page=50" \
              --jq "[.workflow_runs[] | select(.id != $RUN_ID)] | sort_by(.created_at) | last | \"\\(.status)/\\(.conclusion)\"") || last=""
          fi
          if [ "$last" = completed/success ]; then
            echo "CI already passed on this tree (head $tested), so this run skips its jobs."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Check
    runs-on: ubuntu-latest
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    permissions:
      contents: read
    steps:
      # Harden-Runner: audit mode only — logs egress; block mode is follow-up (#179).
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Vale
        run: |
          VALE_VERSION=3.15.1
          curl -fsSL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar xz -C /usr/local/bin vale

      - run: pnpm run verify:peers
      - run: pnpm audit --audit-level=high
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run build
      - name: Test with package-labeled job summaries
        run: |
          # Vitest 4.1 hardcodes "## Vitest Test Report" with no package name.
          # Dump each package's summary separately, then append with a label.
          REAL_SUMMARY="$GITHUB_STEP_SUMMARY"
          CORE_DUMP="$(mktemp)"
          CLI_DUMP="$(mktemp)"
          set +e
          GITHUB_STEP_SUMMARY="$CORE_DUMP" pnpm --filter @merlon-docs/merlon-docs-core test
          CORE_STATUS=$?
          GITHUB_STEP_SUMMARY="$CLI_DUMP" pnpm --filter @merlon-docs/merlon-docs-cli test
          CLI_STATUS=$?
          node --test scripts/*.test.mjs scripts/**/*.test.mjs
          SCRIPTS_STATUS=$?
          set -e
          GITHUB_STEP_SUMMARY="$REAL_SUMMARY" node scripts/append-labeled-vitest-summary.mjs merlon-docs-core "$CORE_DUMP"
          GITHUB_STEP_SUMMARY="$REAL_SUMMARY" node scripts/append-labeled-vitest-summary.mjs merlon-docs-cli "$CLI_DUMP"
          if [ "$CORE_STATUS" -ne 0 ] || [ "$CLI_STATUS" -ne 0 ] || [ "$SCRIPTS_STATUS" -ne 0 ]; then
            exit 1
          fi
      - run: pnpm run skill:validate
      - run: pnpm run prepare:docs
      - run: pnpm run docs:check
      - run: pnpm run docs:compile
      - name: Ensure documentation outputs are up-to-date
        run: git diff --exit-code

  node-minimum:
    name: Node minimum floor
    runs-on: ubuntu-latest
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    permissions:
      contents: read
    steps:
      # Harden-Runner: audit mode only — logs egress; block mode is follow-up (#179).
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pack what npm would publish, so the floor run installs only the packages' runtime dependencies.
      - name: Build and pack core and CLI
        run: |
          pnpm --filter @merlon-docs/merlon-docs-core --filter @merlon-docs/merlon-docs-cli run build
          pnpm --filter @merlon-docs/merlon-docs-core --filter @merlon-docs/merlon-docs-cli pack --pack-destination "$RUNNER_TEMP/packages"

      # Keep in step with engines.node in packages/*/package.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0

      - name: Install the packed packages on the floor version
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y
          npm install --no-audit --no-fund "$RUNNER_TEMP"/packages/*.tgz

      - name: merlon compile and check (examples/sample-guides)
        working-directory: examples/sample-guides
        run: |
          node --version
          "$RUNNER_TEMP/consumer/node_modules/.bin/merlon" compile
          "$RUNNER_TEMP/consumer/node_modules/.bin/merlon" check --skip-vale

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    permissions:
      contents: read
    steps:
      # Harden-Runner: audit mode only — logs egress; block mode is follow-up (#179).
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Coverage with package-labeled job summaries
        run: |
          REAL_SUMMARY="$GITHUB_STEP_SUMMARY"
          CORE_DUMP="$(mktemp)"
          CLI_DUMP="$(mktemp)"
          set +e
          GITHUB_STEP_SUMMARY="$CORE_DUMP" pnpm --filter @merlon-docs/merlon-docs-core run test:coverage
          CORE_STATUS=$?
          GITHUB_STEP_SUMMARY="$CLI_DUMP" pnpm --filter @merlon-docs/merlon-docs-cli run test:coverage
          CLI_STATUS=$?
          set -e
          GITHUB_STEP_SUMMARY="$REAL_SUMMARY" node scripts/append-labeled-vitest-summary.mjs merlon-docs-core "$CORE_DUMP"
          GITHUB_STEP_SUMMARY="$REAL_SUMMARY" node scripts/append-labeled-vitest-summary.mjs merlon-docs-cli "$CLI_DUMP"
          if [ "$CORE_STATUS" -ne 0 ] || [ "$CLI_STATUS" -ne 0 ]; then
            exit 1
          fi

      - name: Write coverage totals table
        if: always()
        run: node scripts/coverage-job-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merlon-docs-core coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-merlon-docs-core
          path: packages/merlon-docs-core/coverage
          if-no-files-found: warn

      - name: Upload merlon-docs-cli coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-merlon-docs-cli
          path: packages/merlon-docs-cli/coverage
          if-no-files-found: warn

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    # Growth-rate benchmarks run on ready pull requests only. They are slower than the unit
    # tests, so `pnpm test`, the git hooks and the land gate leave them out.
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.skip != 'true' && github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    permissions:
      contents: read
    steps:
      # Harden-Runner: audit mode only — logs egress; block mode is follow-up (#179).
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run bench

  changeset:
    name: Changeset
    runs-on: ubuntu-latest
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.skip != 'true' && github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    permissions:
      contents: read
    steps:
      # Harden-Runner: audit mode only — logs egress; block mode is follow-up (#179).
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Require changeset when packages or skills change
        env:
          CHANGESET_SINCE: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "Changeset since PR base: $CHANGESET_SINCE ($PR_BASE_REF)"
          pnpm changeset:status

  formal:
    name: Formal models
    runs-on: ubuntu-latest
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    permissions:
      contents: read
    steps:
      # Harden-Runner: audit mode only — logs egress; block mode is follow-up (#179).
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Runner images ship Java 17 or later; the script downloads and verifies the pinned Alloy jar.
      - name: Check the Alloy models
        run: |
          java -version
          node scripts/formal-check.mjs
