name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # Any target branch (stacked feature PRs, not only main).
    # Changeset checks use github.event.pull_request.base.sha — never a hardcoded branch name.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Force JS actions onto Node 24 (Node 20 deprecated on runners).
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Harden-Runner: audit mode only — logs egress; block mode is follow-up (#179).
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Vale
        run: |
          VALE_VERSION=3.15.1
          curl -fsSL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar xz -C /usr/local/bin vale

      - run: pnpm run verify:peers
      - run: pnpm audit --audit-level=high
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run build
      - name: Test with package-labeled job summaries
        run: |
          # Vitest 4.1 hardcodes "## Vitest Test Report" with no package name.
          # Dump each package's summary separately, then append with a label.
          REAL_SUMMARY="$GITHUB_STEP_SUMMARY"
          CORE_DUMP="$(mktemp)"
          CLI_DUMP="$(mktemp)"
          set +e
          GITHUB_STEP_SUMMARY="$CORE_DUMP" pnpm --filter @bwilliamson/mdcp-core test
          CORE_STATUS=$?
          GITHUB_STEP_SUMMARY="$CLI_DUMP" pnpm --filter @bwilliamson/mdcp-cli test
          CLI_STATUS=$?
          node --test scripts/*.test.mjs scripts/**/*.test.mjs
          SCRIPTS_STATUS=$?
          set -e
          GITHUB_STEP_SUMMARY="$REAL_SUMMARY" node scripts/append-labeled-vitest-summary.mjs mdcp-core "$CORE_DUMP"
          GITHUB_STEP_SUMMARY="$REAL_SUMMARY" node scripts/append-labeled-vitest-summary.mjs mdcp-cli "$CLI_DUMP"
          if [ "$CORE_STATUS" -ne 0 ] || [ "$CLI_STATUS" -ne 0 ] || [ "$SCRIPTS_STATUS" -ne 0 ]; then
            exit 1
          fi
      - run: pnpm run skill:validate
      - run: pnpm run prepare:docs
      - run: pnpm run docs:check
      - run: pnpm run docs:compile
      - name: Ensure documentation outputs are up-to-date
        run: git diff --exit-code

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Harden-Runner: audit mode only — logs egress; block mode is follow-up (#179).
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Coverage with package-labeled job summaries
        run: |
          REAL_SUMMARY="$GITHUB_STEP_SUMMARY"
          CORE_DUMP="$(mktemp)"
          CLI_DUMP="$(mktemp)"
          set +e
          GITHUB_STEP_SUMMARY="$CORE_DUMP" pnpm --filter @bwilliamson/mdcp-core run test:coverage
          CORE_STATUS=$?
          GITHUB_STEP_SUMMARY="$CLI_DUMP" pnpm --filter @bwilliamson/mdcp-cli run test:coverage
          CLI_STATUS=$?
          set -e
          GITHUB_STEP_SUMMARY="$REAL_SUMMARY" node scripts/append-labeled-vitest-summary.mjs mdcp-core "$CORE_DUMP"
          GITHUB_STEP_SUMMARY="$REAL_SUMMARY" node scripts/append-labeled-vitest-summary.mjs mdcp-cli "$CLI_DUMP"
          if [ "$CORE_STATUS" -ne 0 ] || [ "$CLI_STATUS" -ne 0 ]; then
            exit 1
          fi

      - name: Write coverage totals table
        if: always()
        run: node scripts/coverage-job-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mdcp-core coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-mdcp-core
          path: packages/mdcp-core/coverage
          if-no-files-found: warn

      - name: Upload mdcp-cli coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-mdcp-cli
          path: packages/mdcp-cli/coverage
          if-no-files-found: warn

  changeset:
    name: Changeset
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      # Harden-Runner: audit mode only — logs egress; block mode is follow-up (#179).
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Require changeset when packages or skills change
        env:
          CHANGESET_SINCE: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "Changeset since PR base: $CHANGESET_SINCE ($PR_BASE_REF)"
          pnpm changeset:reject-major
          pnpm changeset:status

  release-source:
    name: Release source
    runs-on: ubuntu-latest
    # main is the release branch: only develop (a release) or hotfix/* may target it.
    # Skipped on PRs to any other base, which counts as passing for a required check.
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    permissions: {}
    steps:
      - name: Require develop or hotfix/* as the head branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Pull requests from forks target develop, not main."
            exit 1
          fi
          case "$HEAD_REF" in
            develop | hotfix/*)
              echo "Release source OK: $HEAD_REF -> main"
              ;;
            *)
              echo "::error::main only accepts release PRs from develop or hotfix/* branches. Retarget this PR to develop."
              exit 1
              ;;
          esac
