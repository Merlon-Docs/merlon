name: Pages

on:
  workflow_dispatch:

# Force JS actions onto Node 24 (Node 20 deprecated on runners).
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      indexnow_count: ${{ steps.indexnow.outputs.count }}
      indexnow_payload: ${{ steps.indexnow.outputs.payload }}
    steps:
      # Harden-Runner: audit mode only — logs egress; block mode is follow-up (#179).
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No dependency cache: this workflow deploys to production (same as release.yml).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @merlon-docs/merlon-docs-site test
      # Builds the toolchain, compiles docs, syncs shards into the site, runs
      # astro build, then checks every internal link in dist/.
      - run: pnpm run site:build
      # Runs axe-core (WCAG 2.2 A and AA) on a sample of built pages in both
      # themes at desktop and phone widths, using the runner's Chrome.
      - run: pnpm --filter @merlon-docs/merlon-docs-site run check:a11y

      # Hashes each built page against the hashes the live site published at its last deploy,
      # and writes the new set into dist/ so this deploy publishes it. The changed pages become
      # the IndexNow submission, which the indexnow job sends once the deploy succeeds.
      - name: Plan the IndexNow submission
        id: indexnow
        run: node packages/merlon-docs-site/scripts/indexnow.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/merlon-docs-site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # Deploy the Pages artifact
      id-token: write # OIDC token required by actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Harden-Runner: audit mode only — logs egress; block mode is follow-up (#179).
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  indexnow:
    name: Tell IndexNow which pages changed
    needs: [build, deploy]
    if: needs.build.outputs.indexnow_count != '0'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Harden-Runner: audit mode only — logs egress; block mode is follow-up (#179).
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Submit the changed pages
        env:
          PAYLOAD: ${{ needs.build.outputs.indexnow_payload }}
          COUNT: ${{ needs.build.outputs.indexnow_count }}
        run: |
          curl -fsS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$PAYLOAD"
          echo "Submitted ${COUNT} changed page(s) to IndexNow." | tee -a "$GITHUB_STEP_SUMMARY"
