name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not cancel an in-flight publish if another push lands on main.
  cancel-in-progress: false

# Force JS actions onto Node 24 (Node 20 deprecated on runners).
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  plan:
    name: Release plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # Cancel superseded waiting/queued Release runs
    outputs:
      has_changesets: ${{ steps.detect.outputs.has_changesets }}
      has_missing_releases: ${{ steps.missing.outputs.has_missing_releases }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Concurrency keeps in_progress publishes; waiting (env approval) runs are
      # not cancelled by GHA. Newest plan cancels older waiting/queued runs so
      # only the latest tip needs approval ("latest main wins").
      - name: Cancel superseded waiting/queued Release runs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="${GITHUB_RUN_ID}"
          for status in waiting queued; do
            mapfile -t ids < <(
              gh run list \
                --workflow release.yml \
                --branch main \
                --status "$status" \
                --limit 100 \
                --json databaseId \
                --jq '.[].databaseId'
            )
            for id in "${ids[@]+"${ids[@]}"}"; do
              if [ "$id" = "$current" ]; then
                continue
              fi
              echo "Cancelling superseded Release run ${id} (status=${status})"
              gh run cancel "$id" || true
            done
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Summarize pending changesets
        id: detect
        run: |
          set -euo pipefail
          mapfile -t files < <(find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' ! -name '_*' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            echo "No pending changesets." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Pending release changesets"
            echo ""
            echo "Review these before approving the **release** environment deployment."
            echo ""
            for f in "${files[@]}"; do
              echo "### \`$f\`"
              echo ""
              echo '```markdown'
              cat "$f"
              echo '```'
              echo ""
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          pnpm changeset:reject-major

      - name: Detect missing GitHub Releases
        id: missing
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/detect-missing-github-releases.mjs

  release:
    name: Version and publish
    needs: plan
    if: needs.plan.outputs.has_changesets == 'true' || needs.plan.outputs.has_missing_releases == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release commit, tags, GitHub Releases (via RELEASE_GITHUB_TOKEN for push)
      id-token: write # npm OIDC Trusted Publishing
    environment: release
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # After env approval the trigger SHA may be stale. Reset to tip so version
      # + publish includes all merged changesets; heal still uses package history.
      - name: Reset to latest origin/main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "Release working tree at $(git rev-parse --short HEAD) (origin/main tip)"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Require RELEASE_GITHUB_TOKEN
        env:
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          if [ -z "${RELEASE_GITHUB_TOKEN}" ]; then
            echo "Set repository secret RELEASE_GITHUB_TOKEN (fine-grained PAT: Contents write on this repo)."
            exit 1
          fi

      - name: Version, publish, and GitHub Releases
        env:
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: pnpm release:main
