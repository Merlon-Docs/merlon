name: Feedback or question
description: Ideas, docs gaps, or how-to questions
title: '[Feedback] '
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: |
        Questions and suggestions are welcome. For real-world outcomes, prefer the **Adoption story** template instead.

        Maintainers apply a matching `priority:*` label from your selection below, then finish [new issue intake](https://github.com/betsalel-williamson/mdcp/blob/main/docs/developer/issue-intake-and-labels.md#new-issue-intake-required) (board, Track, Status) — see [Issue intake and labels](https://github.com/betsalel-williamson/mdcp/blob/main/docs/developer/issue-intake-and-labels.md#issue-priority-value-add).

  - type: dropdown
    id: priority
    attributes:
      label: Value-add priority
      description: How much adopter or product value does this represent if we act on it?
      options:
        - P0 — user-facing blocker or broken core path (compile / check / refs)
        - P1 — high near-term value
        - P2 — important backlog
        - P3 — nice-to-have / low urgency
        - Defer — parked on an explicit gate
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What are you trying to do, or what would you like to see improved?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links to shards, repos, or prior issues.
    validations:
      required: false
