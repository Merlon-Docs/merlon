name: Bug report
description: Something broke — CLI, compile, check, or docs tooling
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Include steps to reproduce and the `mdcp-cli` version if you can.

        Maintainers apply a matching `priority:*` label from your selection below, then finish [new issue intake](https://github.com/betsalel-williamson/mdcp/blob/main/docs/developer/issue-intake-and-labels.md#new-issue-intake-required) (board, Track, Status) — see [Issue intake and labels](https://github.com/betsalel-williamson/mdcp/blob/main/docs/developer/issue-intake-and-labels.md#issue-priority-value-add).

  - type: dropdown
    id: priority
    attributes:
      label: Value-add priority
      description: How urgent is this for adopters and the core path? (One label will be applied on triage.)
      options:
        - P0 — user-facing blocker or broken core path (compile / check / refs)
        - P1 — high near-term value
        - P2 — important backlog
        - P3 — nice-to-have / low urgency
        - Defer — parked on an explicit gate
    validations:
      required: true

  - type: input
    id: mdcp-version
    attributes:
      label: mdcp-cli version
      placeholder: '0.5.0'
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `mdcp check` in ...
        2. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: Paste error output or screenshots in a follow-up comment if needed.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, package manager — whatever seems relevant.
      placeholder: macOS 15, Node 22, pnpm 9
    validations:
      required: false
