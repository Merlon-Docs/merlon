# Peer Vale config for this docs tree.
# Multi-language model (Vale OSS): markup engine stays shared; language-specific
# grammar/style rules live in style packages assigned by glob/path sections.
# Example for a mixed-language tree (not enabled here — this repo is en-US only):
#
#   [*.md]
#   BasedOnStyles = General, En
#
#   [*.{de,es,fr}.md]
#   BasedOnStyles = General
#
# Packages = Microsoft is an English style-guide package (US English).
# MerlonDocs style (en-US unlinked heading mentions and dated claims) ships from
# @merlon-docs/merlon-docs-presets/vale/MerlonDocs and is linked by `pnpm vale:sync`.
# MerlonDocs-PandocId is this repo's dogfood-only local style: Pandoc {#id} after headings.
# Linked from docs/vale-local/MerlonDocs-PandocId by `pnpm vale:sync`.
# MerlonDocs heading-mention rules use scope: ~heading, and MerlonDocs.DatedClaim checks
# headings too; MerlonDocs-PandocId uses scope: heading for Pandoc ids.
# Vale 3.15.1 mutates local directory Packages while syncing, so this repo uses
# the symlink fallback until Merlon Docs ships release zip packages.
# GFM / Markdown structure is enforced separately via markdownlint.
# See docs/features/design-constraints/locale-and-language.md
StylesPath = styles
MinAlertLevel = suggestion

Packages = Microsoft

[*.{md,mdx}]
BasedOnStyles = Microsoft, MerlonDocs, MerlonDocs-PandocId

# Ignore already-linked markdown so MerlonDocs prose rules do not false-positive on link labels.
TokenIgnores = \[(?:\\.|[^\[\]\\]|\[(?:\\.|[^\[\]\\])*\])*\]\([^)]*\)

Microsoft.Adverbs = NO
Microsoft.FirstPerson = NO
Microsoft.We = NO
Microsoft.SentenceLength = NO
Microsoft.HeadingPunctuation = NO
Microsoft.Contractions = NO
Microsoft.Terms = NO
Microsoft.Dashes = NO
Microsoft.Headings = NO
Microsoft.HeadingAcronyms = NO
Microsoft.HeadingColons = NO
Microsoft.Acronyms = NO
Microsoft.Semicolon = NO
Microsoft.GeneralURL = NO
Microsoft.URLFormat = NO
Microsoft.Foreign = NO
Microsoft.Auto = NO
Microsoft.Quotes = NO
Microsoft.Units = NO

Microsoft.Passive = suggestion
Microsoft.Wordiness = suggestion
Microsoft.Accessibility = suggestion
Microsoft.Vocab = NO

# CODE_OF_CONDUCT.md is the Contributor Covenant 2.0, adapted only to name Merlon Docs'
# maintainers and reporting channel. Its wording follows upstream, so this repo's
# prose style does not apply to it.
# merlon passes Vale absolute paths, so the section starts with **/. It stays the last
# section, after every section that matches the file, because Vale takes
# BasedOnStyles and each rule's level from the last matching section that sets them.
# It turns off the rules that [*.{md,mdx}] enables by name. Coverage and link
# validation still check the file as a standalone guide.
[**/CODE_OF_CONDUCT.md]
BasedOnStyles =
Microsoft.Passive = NO
Microsoft.Wordiness = NO
Microsoft.Accessibility = NO
