packages:
  - 'packages/*'

# pnpm supply-chain (2026 best practice)
minimumReleaseAge: 10080
strictDepBuilds: true
allowBuilds:
  esbuild: true
# Pin patched versions to resolve high-severity advisories. Exact/scoped pins keep
# resolution deterministic and avoid floating to vulnerable or newer-major versions.
overrides:
  # https://github.com/advisories/GHSA-68fv-2mgg-jv7q source-map-js allows event-loop denial of service through indexed source-map section offsets patched >=1.2.2.
  source-map-js: 1.2.2
  # GHSA-7p8r-x3mc-p8w7 + IDN canonicalization: patched >=3.1.6.
  # GHSA-qw65-cvwx-89v3 (<3.1.7) and GHSA-58mr-gqgx-xq4g (=3.1.6): patched >=3.1.7.
  # Pin the patched 3.x line (a bare range can float to vulnerable 4.1.0).
  fast-uri: 3.1.8
  # GHSA-rgw5-rvv9-x895 (<5.0.9), GHSA-6j4f-fj2g-mc7p (<5.0.10) and
  # GHSA-qhr7-859c-m2p7 (<5.0.11): patched >=5.0.11.
  brace-expansion@<5.0.12: 5.0.12
  # merlon-docs-site → mermaid → chevrotain / dagre-d3-es → lodash-es (dev-only docs site).
  # GHSA-r5fr-rjxr-66jc: vulnerable <=4.17.23, patched >=4.18.1.
  lodash-es@<4.18.1: 4.18.1
  # GHSA-r28c-9q8g-f849 (<=8.5.17) + GHSA-fxqj-rqcc-2cmp (<=8.5.22): patched >=8.5.23.
  postcss@<8.5.29: 8.5.29
  # GHSA-pm4m-ph32-ghv5 (<=5.2.1) + GHSA-r3ph-w7gj-g6xm (<=5.4.0): patched >=5.4.1.
  js-yaml@5: 5.4.3
  # CVE-2026-59870 + GHSA-2883-xcg3-v3hh: patched >=4.3.2.
  js-yaml@4: 4.3.2
  # GHSA-2v37-7h3g-55p8: timing attack on nanoid, patched >=3.3.18.
  nanoid@<3.3.18: 3.3.18
  # GHSA-7w5x-hrqm-74c2 (<=1.7.0) + GHSA-r4xh-jqrq-34v2 (<=1.8.0): patched >=1.9.0.
  smol-toml@<1.9.1: 1.9.1
  # merlon-docs-site → mermaid → dompurify (dev-only docs site).
  # GHSA-v2wj-7wpq-c8vv / GHSA-h7mw-gpvr-xq4m / GHSA-crv5-9vww-q3g8: patched >=3.4.0.
  # GHSA-cg2g-xh64-v4q7 (>=3.4.4 <=3.4.16) + GHSA-mrv2-3pqr-j5jr (<=3.4.16): patched >=3.4.17.
  dompurify: ^3.4.17
  # @changesets/cli → launch-editor → shell-quote (dev-only release tooling).
  # GHSA-pqg4-j6r4-53mv: command injection in quote(), patched >=1.11.0.
  shell-quote@<1.12.0: 1.12.0
  # @changesets/cli → launch-editor (dev-only release tooling).
  # GHSA-587h-7wmj-h5pm: existence check bypass on Windows, patched >=2.14.2.
  launch-editor@<2.14.2: 2.14.2
  # vitest → @vitest/mocker → vite, and astro → vite (dev-only test and site tooling).
  # GHSA-587h-7wmj-h5pm (launch-editor, bundled >=8.3.0 <=8.3.2): patched >=8.3.3.
  vite@>=8.3.0 <8.3.3: 8.3.5
  # markdownlint-cli2 → markdown-it (dev-only lint of this repo's Markdown).
  # GHSA-r7fv-28h4-cvq7 (<15.0.2) + GHSA-gfr2-rv44-r23c (<15.0.3): patched >=15.0.3.
  markdown-it@>=15.0.0 <15.0.3: 15.0.3
  # markdownlint-cli2 → markdownlint → re2js (dev-only lint of this repo's Markdown).
  # GHSA-gg6h-894w-4m9c (>=2.2.0 <2.8.7): patched >=2.8.7.
  re2js@>=2.2.0 <2.8.7: 2.8.7
  # merlon-docs-site → astro → unifont → undici (dev-only docs site build).
  # GHSA-xjj6-f33q-929c / GHSA-4w7w-5xrc-9h26 / GHSA-2m5v-pch6-74hx / GHSA-qrxm-fqhp-jwvm
  # (>=8.0.0 <8.12.2): patched >=8.12.2.
  undici@>=8.0.0 <8.12.2: 8.12.3
  # merlon-docs-site → astro and @astrojs/sitemap → zod (dev-only docs site build).
  # merlon-docs-core requires ^4.6.6 directly. GHSA-mrhx-c7xc-m3w5: patched >=4.6.6.
  zod@<4.6.6: 4.6.7
  # merlon-docs-site → astro → sharp (dev-only docs site build).
  # GHSA-wq5f-xc86-pv6w / CVE-2026-96889: librsvg dependency, patched >=0.35.5.
  sharp@<0.35.5: 0.35.5
  # merlon-docs-site → astro → http-cache-semantics (dev-only docs site build).
  # GHSA-ch52-4w7c-c8xp: vulnerable <=4.2.0, patched >=4.3.0.
  http-cache-semantics@<4.3.0: 4.3.0
# Unfixable advisories (no patched version published yet). Ignore so
# `pnpm audit --audit-level=high` exits 0 without --ignore-unfixable.
# - GHSA-vfj7-8cjw-p6xm: braces <=3.0.3, no patched version. Dev-only since
#   merlon-docs-core moved from fast-glob to tinyglobby (which has no braces
#   dependency): markdownlint-cli2 → globby → fast-glob → micromatch → braces,
#   run by `pnpm lint` on this repo's own Markdown and config, not on outside input.
#   Added 2026-10-03; recheck 2026-11-03.
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm
