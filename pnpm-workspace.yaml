packages:
  - 'packages/*'

# pnpm supply-chain (2026 best practice)
minimumReleaseAge: 10080
# Security patches published inside the age gate (must be allowed through explicitly).
# - js-yaml@5.2.2: GHSA-pm4m-ph32-ghv5 (markdownlint-cli2 → js-yaml)
# - js-yaml@3.15.1: CVE-2026-59870 (slidev → gray-matter → js-yaml 3.x)
# - nanoid@3.3.18: GHSA-2v37-7h3g-55p8 (slidev → postcss → nanoid)
# - browserslist@4.28.7: GHSA-c83g-rgw3-j3cx (slidev → @babel → browserslist)
minimumReleaseAgeExclude:
  - js-yaml@3.15.2 || 4.3.2 || 5.2.2
  - nanoid@3.3.18
  - browserslist@4.28.7
  - smol-toml@1.7.1
  - source-map-js@1.2.2
strictDepBuilds: true
allowBuilds:
  esbuild: true
# Pin patched versions to resolve high-severity advisories. Exact/scoped pins keep
# resolution deterministic and avoid floating to vulnerable or newer-major versions.
overrides:
  # https://github.com/advisories/GHSA-68fv-2mgg-jv7q source-map-js allows event-loop denial of service through indexed source-map section offsets patched >=1.2.2.
  source-map-js: 1.2.2
  # GHSA-7p8r-x3mc-p8w7 + IDN canonicalization: patched >=3.1.6.
  # GHSA-qw65-cvwx-89v3 (<3.1.7) and GHSA-58mr-gqgx-xq4g (=3.1.6): patched >=3.1.7.
  # Pin the patched 3.x line (a bare range can float to vulnerable 4.1.0).
  fast-uri: 3.1.8
  # GHSA-rgw5-rvv9-x895 (<5.0.9), GHSA-6j4f-fj2g-mc7p (<5.0.10) and
  # GHSA-qhr7-859c-m2p7 (<5.0.11): patched >=5.0.11.
  brace-expansion@<5.0.12: 5.0.12
  # Slidev → mermaid → chevrotain → lodash-es (dev-only presentation tooling).
  # GHSA-r5fr-rjxr-66jc: vulnerable <=4.17.23, patched >=4.18.1.
  lodash-es@<4.18.1: 4.18.1
  # GHSA-r28c-9q8g-f849: vulnerable <=8.5.17, patched >=8.5.18.
  postcss@<8.5.18: 8.5.18
  # GHSA-pm4m-ph32-ghv5: vulnerable >=5.0.0 <=5.2.1, patched >=5.2.2.
  js-yaml@5: 5.2.2
  # CVE-2026-59870 + GHSA-2883-xcg3-v3hh: patched >=4.3.2.
  js-yaml@4: 4.3.2
  # CVE-2026-59870 + GHSA-2883-xcg3-v3hh: patched >=3.15.2.
  js-yaml@<3.15.2: 3.15.2
  # GHSA-2v37-7h3g-55p8: timing attack on nanoid, patched >=3.3.18.
  nanoid@<3.3.18: 3.3.18
  # GHSA-c83g-rgw3-j3cx / GHSA-pghv-3wc2-6249: OOM and prototype write, patched >=4.28.7.
  browserslist@<=4.28.6: 4.28.7
  # GHSA-7w5x-hrqm-74c2: DoS via malformed TOML, patched >=1.7.1.
  smol-toml@<=1.7.0: 1.7.1
  # Slidev → monaco-editor → dompurify (dev-only presentation tooling).
  # GHSA-v2wj-7wpq-c8vv / GHSA-h7mw-gpvr-xq4m / GHSA-crv5-9vww-q3g8: patched >=3.4.0.
  dompurify: ^3.4.0
  # Slidev → MCP SDK → @hono/node-server (dev-only presentation tooling).
  # GHSA-frvp-7c67-39w9: path traversal <2.0.5; GHSA-9mqv-5hh9-4cgg: DoS <=2.0.9.
  # Pin >=2.0.10 (2.0.11+ still inside minimumReleaseAge).
  '@hono/node-server@<2.0.10': 2.0.10
# Unfixable advisories (no patched version published yet). Ignore so
# `pnpm audit --audit-level=high` exits 0 without --ignore-unfixable.
# - GHSA-w3rx-r6r6-pgpr: image-size — patched >=2.0.3, but 2.0.3 not published
# - GHSA-5p2g-fcmc-qvqq: image-size — patched >=2.0.3, but 2.0.3 not published
# - GHSA-vfj7-8cjw-p6xm: braces <=3.0.3, no patched version (slidev → chokidar 3,
#   dev-only presentation tooling). Added 2026-10-03; recheck 2026-11-03.
# - GHSA-ch52-4w7c-c8xp: http-cache-semantics <=4.2.0, no patched version
#   (mdcp-site → astro, dev-only docs site build). Added 2026-10-03; recheck 2026-11-03.
audit:
  ignore:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-ch52-4w7c-c8xp
