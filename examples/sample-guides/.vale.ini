StylesPath = styles
MinAlertLevel = suggestion

Packages = Microsoft

[*.{md,mdx}]
# MDCP: en-US unlinked heading mentions (~heading) and dated claims. MDCP-PandocId: Pandoc {#…}.
BasedOnStyles = Microsoft, MDCP, MDCP-PandocId
TokenIgnores = \[(?:\\.|[^\[\]\\]|\[(?:\\.|[^\[\]\\])*\])*\]\([^)]*\)

